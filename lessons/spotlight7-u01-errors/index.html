        hint: 'Пиши простыми предложениями. Отмечай пункты чек-листа справа, когда они уже есть в тексте.',
        sample: 'I live in a big city. It is noisy, but there are a lot of parks…',
        checklist: [
          '{v|am / is / are} — 2 раза',
          '{v|there is} — 1 раз',

          '{a|a / an} — 2 раза',
